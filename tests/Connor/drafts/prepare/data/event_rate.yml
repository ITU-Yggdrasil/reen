schema: reen.prepare/v2
kind: data
source:
  path: data/event_rate.md
  kind: data
  title: 'Data: EventRate'
export:
  name: EventRate
attributes:
- name: cell
  description: the GeographicCell the rate applies to
- name: events_per_minute
  description: average events per minute for the cell, as a non-negative finite decimal number
- name: window
  description: the TimeWindow the rate was derived from
invariants:
- events_per_minute must be finite and non-negative.
- Negative values, not-a-number, and infinity are invalid.
- The rate is computed as event count divided by window minutes using decimal division.
- Because the window is always at least one minute, division by zero does not occur.
- EventRate defines no presentation rounding; formatting is the responsibility of the serialising context.
operations:
- name: new
  description: Constructs an EventRate from the cell, events_per_minute, and window. Returns an error if the value is not finite or is negative.
scenarios:
- name: rate from count and window
  given: an EventCount of 10 over a five-minute window
  when: the rate is derived
  then: events_per_minute is 2.0
- name: zero-count cell
  given: an EventCount of 0
  when: the rate is derived
  then: events_per_minute is 0.0
