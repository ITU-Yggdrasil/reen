schema: reen.prepare/v2
kind: data
source:
  path: data/grid.md
  kind: data
  title: 'Data: GridContext'
export:
  name: GridContext
attributes:
- name: resolution
  description: the GridResolution that determines the size of each cell
- name: cells
  description: the complete pre-computed list of GeographicCells in the grid
invariants:
- The grid uses a fixed origin of -90 degrees latitude and -180 degrees longitude.
- Cell bands step northward and eastward from the origin.
- 180 divided by the resolution's degrees_latitude must be a whole number.
- 360 divided by the resolution's degrees_longitude must be a whole number.
- The grid is immutable after construction.
operations:
- name: new
  description: Constructs a Grid from the provided GridResolution. Lays out cell bands by stepping northward and eastward from the fixed origin. Fails if either extent is not divided evenly by the resolution.
- name: cell_for
  description: Returns the GeographicCell whose bounds contain the given latitude and longitude. Valid latitude range is -90 to 90 degrees; valid longitude range is -180 to 180 degrees. Inputs outside those ranges are clamped to the nearest valid bound before assignment. Every coordinate after clamping maps to exactly one cell. Interior boundary values belong to the cell for which that boundary is the lower bound. Latitude 90 maps to the northernmost band. Longitude 180 maps to the easternmost band.
- name: all_cells
  description: Returns the complete list of GeographicCells in the grid. Cells are enumerated from south to north and, within each latitude band, from west to east. For the default ten-degree resolution, the total is 648 cells.
scenarios:
- name: default resolution produces 648 cells
  given: a GridResolution of ten degrees on both axes
  when: new is called
  then: a Grid with 648 cells is returned
- name: uneven resolution is rejected
  given: a GridResolution where degrees_latitude is 7
  when: new is called
  then: construction fails because 180 divided by 7 is not a whole number
- name: London maps to correct cell
  given: the default ten-degree resolution
  when: cell_for is called with latitude 51.5 and longitude -0.1
  then: the returned cell has min_latitude 50, max_latitude 60, min_longitude -10, max_longitude 0
- name: clamping at the north pole
  given: latitude 91 (out of range)
  when: cell_for is called
  then: the latitude is clamped to 90 and maps to the northernmost band
