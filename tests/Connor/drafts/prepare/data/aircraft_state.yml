- source: invariant
  given: icao "A1B2C3", callsign "UAL123", latitude 40.6, longitude -73.8, altitude 35000, UTC timestamp, and all boundary values are normalized
  when: new is called with these normalized boundary values
  then: an AircraftState is constructed and all fields are initialized to their provided normalized values
  citation: 'operation `new`: Constructs an AircraftState from normalized boundary values'
- source: invariant
  given: icao "A1B2C3", callsign "", latitude 40.6, longitude -73.8, altitude 35000, and a UTC timestamp
  when: new is called with an empty callsign string
  then: an AircraftState is returned with the empty callsign preserved, demonstrating that normalization handles empty string values
  citation: 'operation `new`: Constructs an AircraftState from normalized boundary values'
- source: invariant
  given: icao "A1B2C3", callsign "UAL123", latitude at minimum boundary (−90), longitude at minimum boundary (−180), altitude 0, and a UTC timestamp
  when: new is called with minimum normalized boundary values
  then: an AircraftState is constructed with all minimum boundary values accepted and stored
  citation: 'operation `new`: Constructs an AircraftState from normalized boundary values'
- source: invariant
