schema: reen.prepare/v2
kind: data
source:
  path: data/aircraft_state.md
  kind: data
  title: 'Data: AircraftState'
export:
  name: AircraftState
attributes:
- name: icao
  description: ICAO transponder address expressed as hexadecimal text, used as fallback label when callsign is absent
- name: callsign
  description: optional flight identifier broadcast by the aircraft, preferred label when present
- name: latitude
  description: optional latitude in decimal degrees; if absent, no PositionEvent is produced
- name: longitude
  description: optional longitude in decimal degrees; if absent, no PositionEvent is produced
- name: altitude
  description: altitude in feet or the special value "ground", informational only
- name: squawk
  description: optional four-digit octal squawk code, informational only
- name: timestamp
  description: UTC timestamp for the observed position, converted from wire format by the receiver
operations:
- name: new
  description: Constructs an AircraftState from normalized boundary values.
scenarios:
- name: aircraft with callsign
  given: icao "A1B2C3", callsign "UAL123", latitude 40.6, longitude -73.8, altitude 35000, and a UTC timestamp
  when: new is called
  then: an AircraftState is returned; the receiver will use "UAL123" as the event label
- name: aircraft without callsign
  given: icao "A1B2C3", callsign absent, latitude 40.6, longitude -73.8
  when: the receiver maps this record
  then: the ICAO hex code "A1B2C3" is used as the event label
synthesised_tests:
- source: scenario
  given: icao "A1B2C3", callsign "UAL123", latitude 40.6, longitude -73.8, altitude 35000, and a UTC timestamp
  when: new is called
  then: an AircraftState is returned; the receiver will use "UAL123" as the event label
  citation: Scenarios / aircraft with callsign
- source: scenario
  given: icao "A1B2C3", callsign absent, latitude 40.6, longitude -73.8
  when: the receiver maps this record
  then: the ICAO hex code "A1B2C3" is used as the event label
  citation: Scenarios / aircraft without callsign
- source: invariant
  given: icao "A1B2C3", callsign "UAL123", latitude 40.6, longitude -73.8, altitude 35000, UTC timestamp, and all boundary values are within normalized ranges
  when: new is called with these normalized boundary values
  then: an AircraftState is constructed with all fields normalized and stored correctly
  citation: 'operation `new`: Constructs an AircraftState from normalized boundary values'
- source: invariant
  given: latitude at minimum normalized boundary (e.g., -90), longitude at maximum normalized boundary (e.g., 180), altitude at minimum (0), and icao "A1B2C3"
  when: new is called with extreme normalized boundary values
  then: an AircraftState is constructed successfully with these extreme boundary values preserved
  citation: 'operation `new`: Constructs an AircraftState from normalized boundary values'
- source: invariant
  given: latitude 40.6, longitude -73.8, altitude 35000, icao "A1B2C3", and a UTC timestamp with sub-second precision
  when: new is called to construct the AircraftState
  then: the timestamp is normalized and stored with appropriate precision in the resulting AircraftState
  citation: 'operation `new`: Constructs an AircraftState from normalized boundary values'
vocabulary_bindings:
