  when: the invariant is tested
  then: 'the invariant holds: Filtering by source uses the source field, not the label.'
  citation: Invariants / Filtering by source uses the source field, not the label.
- source: invariant
  given: a PositionEvent constructed with latitude 48.8, longitude 2.3, a UTC timestamp, source 'seismic', and label 'earthquake'
  when: the source field is accessed directly
  then: it returns 'seismic', confirming source is a stored data model field
  citation: 'invariant: The source is part of the event''s data model, not an inferred property.'
- source: invariant
  given: three PositionEvent instances with sources 'weather', 'weather', and 'radar'
  when: events are filtered by source 'weather' using the source field
  then: exactly two events are returned, both with source field equal to 'weather'
  citation: 'invariant: Filtering by source uses the source field, not the label.'
- source: invariant
  given: latitude 35.0, longitude 139.0, a UTC timestamp, source 'tsunami', and label 'ocean-surge'
  when: new is called with these parameters
  then: the resulting PositionEvent has source field 'tsunami' distinct from label 'ocean-surge'
  citation: 'operation `new`: Constructs a PositionEvent from latitude, longitude, occurred_at, source, and label.'
- source: invariant
  given: a PositionEvent with an empty string as source
  when: the source field is checked for presence
  then: the source field exists in the data model, even if empty
  citation: 'invariant: Every PositionEvent includes a source.'
