  then: 'the invariant holds: Every PositionEvent includes a source.'
  citation: Invariants / Every PositionEvent includes a source.
- source: invariant
  given: 'a Data: PositionEvent that might violate: The source is part of the event''s data model, not an inferred property.'
  when: the invariant is tested
  then: 'the invariant holds: The source is part of the event''s data model, not an inferred property.'
