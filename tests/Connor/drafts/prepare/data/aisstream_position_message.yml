  citation: 'invariant: observed_at is a full UTC timestamp (the AIS Timestamp field in these message families is only the reported second within the current UTC minute and must not be used as the event timestamp)'
- source: invariant
  given: a raw position record with multiple possible coordinate representations from the AIS message
