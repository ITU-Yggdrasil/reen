schema: reen.prepare/v2
kind: data
source:
  path: data/aisstream_position_message.md
  kind: data
  title: 'Data: AISStreamPositionMessage'
export:
  name: AISStreamPositionMessage
attributes:
- name: message_type
  description: the AISStream message family that produced this record; allowed values are "PositionReport" and "StandardClassBPositionReport"
- name: mmsi
  description: vessel MMSI taken from the upstream user identifier, used as fallback label
- name: vessel_name
  description: optional vessel name from metadata, preferred label when present
- name: latitude
  description: optional normalized latitude in decimal degrees; the invalid sentinel value 91.0 indicates absence
- name: longitude
  description: optional normalized longitude in decimal degrees; the invalid sentinel value 181.0 indicates absence
- name: observed_at
  description: full UTC instant for the message observation, used as the PositionEvent timestamp
- name: metadata_json
  description: optional serialized metadata payload stored as text because the upstream shape is not stable
invariants:
- Only PositionReport and StandardClassBPositionReport message families may be represented.
- The record is normalized into one consistent shape before the receiver reads it.
- observed_at is a full UTC timestamp (the AIS Timestamp field in these message families is only the reported second within the current UTC minute and must not be used as the event timestamp).
operations:
- name: new
  description: Constructs an AISStreamPositionMessage from normalized boundary values.
scenarios:
- name: valid position message
  given: message_type "PositionReport", mmsi "123456789", vessel_name "CARGO SHIP", latitude 51.5, longitude -0.1, observed_at as a UTC timestamp
  when: new is called
  then: an AISStreamPositionMessage is returned
- name: invalid latitude sentinel
  given: latitude 91.0
  when: the receiver processes this record
  then: the record is discarded because 91.0 is the AIS invalid-coordinate sentinel
