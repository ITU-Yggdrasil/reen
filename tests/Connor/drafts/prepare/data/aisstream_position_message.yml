  given: message_type "SafetyAcknowledgement" (not PositionReport or StandardClassBPositionReport)
  when: new is called
  then: an error is raised or the construction fails because SafetyAcknowledgement violates the message family invariant
  citation: 'invariant: Only PositionReport and StandardClassBPositionReport message families may be represented'
- source: invariant
  given: a PositionReport message with AIS Timestamp field set to 45 (seconds within minute) and a raw event time of 2024-01-15T10:30:45Z
  when: normalized into an AISStreamPositionMessage
  then: the observed_at field is set to the full UTC timestamp 2024-01-15T10:30:45Z, not derived from the AIS Timestamp field alone
  citation: 'invariant: observed_at is a full UTC timestamp (the AIS Timestamp field in these message families is only the reported second within the current UTC minute and must not be used as the event timestamp)'
- source: invariant
  given: a StandardClassBPositionReport with longitude -180.0
  when: new is called with this boundary value
  then: an AISStreamPositionMessage is returned with longitude normalized to -180.0
  citation: 'operation `new`: Constructs an AISStreamPositionMessage from normalized boundary values'
- source: invariant
  given: a PositionReport message with latitude 0.0 and longitude 0.0
  when: new is called
  then: an AISStreamPositionMessage is returned with the coordinates preserved as valid (neither coordinate is the AIS invalid-coordinate sentinel)
  citation: 'operation `new`: Constructs an AISStreamPositionMessage from normalized boundary values; invariant: observed_at is a full UTC timestamp'
- source: invariant
  given: an AISStreamPositionMessage after normalization
  when: the receiver inspects the record structure
  then: the record presents a single consistent shape regardless of whether it originated from PositionReport or StandardClassBPositionReport
  citation: 'invariant: The record is normalized into one consistent shape before the receiver reads it'
