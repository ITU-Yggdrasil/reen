schema: reen.prepare/v2
kind: data
source:
  path: data/event_count.md
  kind: data
  title: 'Data: EventCount'
export:
  name: EventCount
attributes:
- name: cell
  description: the GeographicCell the count applies to
- name: count
  description: the number of matching PositionEvents in the cell, as a non-negative whole number
- name: window
  description: the TimeWindow the count was computed over
invariants:
- The count must be greater than or equal to zero.
- Fractional counts are invalid.
- Each matching PositionEvent contributes exactly one to the total for its cell.
operations:
- name: new
  description: Constructs an EventCount from the cell, count, and window.
scenarios:
- name: cell with three events
  given: a GeographicCell, a count of 3, and a five-minute TimeWindow
  when: new is called
  then: an EventCount with count 3 is returned
- name: empty cell has zero count
  given: a GeographicCell with no matching events
  when: the count is computed
  then: the count is zero
synthesised_tests:
