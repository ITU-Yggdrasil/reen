schema: reen.prepare/v2
kind: data
source:
  path: data/grid_resolution.md
  kind: data
  title: 'Data: GridResolution'
export:
  name: GridResolution
attributes:
- name: degrees_latitude
  description: height of each cell in decimal degrees of latitude; default is ten degrees
- name: degrees_longitude
  description: width of each cell in decimal degrees of longitude; default is ten degrees
invariants:
- Both values must be positive.
- 180 divided by degrees_latitude must be a whole number (the latitude extent divides evenly).
- 360 divided by degrees_longitude must be a whole number (the longitude extent divides evenly).
operations:
- name: new
  description: Constructs a GridResolution from the provided axis sizes.
scenarios:
- name: default resolution
  given: degrees_latitude is 10 and degrees_longitude is 10
  when: new is called
  then: a GridResolution is returned that produces 648 cells globally
- name: uneven division is rejected
  given: degrees_latitude is 7
  when: new is called
  then: construction fails because 180 divided by 7 is not a whole number
synthesised_tests:
- source: scenario
  given: degrees_latitude is 10 and degrees_longitude is 10
  when: new is called
  then: a GridResolution is returned that produces 648 cells globally
  citation: Scenarios / default resolution
- source: scenario
  given: degrees_latitude is 7
  when: new is called
  then: construction fails because 180 divided by 7 is not a whole number
  citation: Scenarios / uneven division is rejected
- source: invariant
  given: 'a Data: GridResolution that might violate: Both values must be positive.'
  when: the invariant is tested
  then: 'the invariant holds: Both values must be positive.'
  citation: Invariants / Both values must be positive.
- source: invariant
  given: 'a Data: GridResolution that might violate: 180 divided by degrees_latitude must be a whole number (the latitude extent divides evenly).'
  when: the invariant is tested
  then: 'the invariant holds: 180 divided by degrees_latitude must be a whole number (the latitude extent divides evenly).'
  citation: Invariants / 180 divided by degrees_latitude must be a whole number (the latitude extent divides evenly).
- source: invariant
  given: 'a Data: GridResolution that might violate: 360 divided by degrees_longitude must be a whole number (the longitude extent divides evenly).'
  when: the invariant is tested
  then: 'the invariant holds: 360 divided by degrees_longitude must be a whole number (the longitude extent divides evenly).'
  citation: Invariants / 360 divided by degrees_longitude must be a whole number (the longitude extent divides evenly).
- source: invariant
  given: degrees_latitude is 0 and degrees_longitude is 10
  when: new is called
  then: construction fails because degrees_latitude is not positive
  citation: 'invariant: Both values must be positive.'
- source: invariant
  given: degrees_latitude is 10 and degrees_longitude is -5
  when: new is called
  then: construction fails because degrees_longitude is not positive
  citation: 'invariant: Both values must be positive.'
- source: invariant
  given: degrees_latitude is -10 and degrees_longitude is -10
  when: new is called
  then: construction fails because both values are not positive
  citation: 'invariant: Both values must be positive.'
- source: invariant
  given: degrees_latitude is 36 and degrees_longitude is 10
  when: new is called
  then: a GridResolution is returned because 180 divided by 36 equals 5
  citation: 'invariant: 180 divided by degrees_latitude must be a whole number (the latitude extent divides evenly).'
- source: invariant
  given: degrees_latitude is 10 and degrees_longitude is 120
  when: new is called
  then: a GridResolution is returned because 360 divided by 120 equals 3
  citation: 'invariant: 360 divided by degrees_longitude must be a whole number (the longitude extent divides evenly).'
- source: invariant
  given: degrees_latitude is 10 and degrees_longitude is 45
  when: new is called
  then: construction fails because 360 divided by 45 is not a whole number
  citation: 'invariant: 360 divided by degrees_longitude must be a whole number (the longitude extent divides evenly).'
- source: invariant
  given: degrees_latitude is 90 and degrees_longitude is 180
  when: new is called
  then: a GridResolution is returned because 180 divided by 90 equals 2 and 360 divided by 180 equals 2
  citation: 'operation `new`: Constructs a GridResolution from the provided axis sizes.'
vocabulary_bindings:
- name: degrees_latitude
  resolution: attribute
- name: degrees_longitude
  resolution: attribute
