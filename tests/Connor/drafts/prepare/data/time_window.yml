schema: reen.prepare/v2
kind: data
source:
  path: data/time_window.md
  kind: data
  title: 'Data: TimeWindow'
export:
  name: TimeWindow
attributes:
- name: duration
  description: human-readable label such as "5 minutes", used for display and logging
- name: minutes
  description: numeric duration in whole minutes, used by the buffer and aggregator
invariants:
- The minutes value must be a whole number greater than or equal to 1.
- Zero, negative, and fractional minute values are invalid.
- The leading integer in the duration label must exactly equal the minutes value.
operations:
- name: new
  description: Constructs a TimeWindow from the human-readable label and the numeric minute value. Returns an error if the minutes value is invalid or if the duration label does not match.
scenarios:
- name: valid five-minute window
  given: duration "5 minutes" and minutes 5
  when: new is called
  then: a TimeWindow is returned
- name: zero minutes is rejected
  given: duration "0 minutes" and minutes 0
  when: new is called
  then: an error is returned
- name: mismatched duration is rejected
  given: duration "10 minutes" and minutes 5
  when: new is called
  then: an error is returned because the leading integer does not match
