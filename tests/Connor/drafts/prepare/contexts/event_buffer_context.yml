schema: reen.prepare/v2
kind: context
source:
  path: contexts/event_buffer_context.md
  kind: context
  title: 'Context: EventBufferContext'
export:
  name: EventBufferContext
role_players:
- name: clock
  data_type: Clock
  responsibility: supplies the current moment in time as a UTC timestamp for staleness checks
role_methods:
- role: clock
  methods:
  - name: now
    canonical_name: clock_now
    citation: returns the current moment in time as a UTC timestamp
props:
- name: window
  description: the TimeWindow defining how long an event is retained; future-dated events are still retained
functionalities:
- name: new
  description: Constructs the buffer with the provided clock and TimeWindow. Starts with an empty internal event collection.
- name: window
  description: Returns the TimeWindow currently configured on the buffer. Does not modify the event collection.
- name: receive_event
  description: Accepts an incoming PositionEvent and adds it to the buffer. Does not evict stale events on every insert; eviction is driven by queries or explicit eviction.
- name: current_events
  description: Returns all PositionEvents whose occurred_at is within the configured TimeWindow relative to the current moment. Computes the staleness boundary as the current time minus the window's duration in minutes. Does not impose an upper freshness bound at the current time — future-dated events are included as long as they are not stale. Evicts stale events before returning the result.
- name: current_events_for_source
  description: Performs the same stale-event eviction as current_events. If the source filter is absent, returns the same result as current_events. If the source is "lightning", "flight", "earthquake", "aisstream", "adsb", or "wiki", returns only events whose source matches that value. Filtering is based on the event source, not the label.
- name: evict_stale
  description: Removes all events whose occurred_at is older than the current time minus the window's duration in minutes. Does not remove future-dated events. After eviction, the buffer contains only events that would currently be returned by current_events.
realisation_target: client_also
scenarios:
- name: buffer starts empty
  given: a clock and a five-minute window
  when: new is called
  then: the buffer starts empty
- name: recent event is included
  given: an event from five seconds ago and a five-minute window
  when: current_events is called
  then: the event is included
- name: stale event is evicted
  given: the buffer contains one stale event and one fresh event
  when: evict_stale runs
  then: only the fresh event remains
- name: source filter returns only matching events
  given: the buffer contains lightning, flight, earthquake, AISStream, ADS-B, and wiki events
  when: current_events_for_source is called with source "lightning"
  then: only lightning events are returned
- name: receive adds event to buffer
  given: a fresh PositionEvent
  when: receive_event is called
  then: the event becomes part of the buffer
synthesised_tests:
- source: scenario
  given: a clock and a five-minute window
  when: new is called
  then: the buffer starts empty
  citation: Scenarios / buffer starts empty
- source: scenario
  given: an event from five seconds ago and a five-minute window
  when: current_events is called
  then: the event is included
  citation: Scenarios / recent event is included
- source: scenario
  given: the buffer contains one stale event and one fresh event
  when: evict_stale runs
  then: only the fresh event remains
  citation: Scenarios / stale event is evicted
- source: scenario
  given: the buffer contains lightning, flight, earthquake, AISStream, ADS-B, and wiki events
  when: current_events_for_source is called with source "lightning"
  then: only lightning events are returned
  citation: Scenarios / source filter returns only matching events
- source: scenario
  given: a fresh PositionEvent
  when: receive_event is called
  then: the event becomes part of the buffer
  citation: Scenarios / receive adds event to buffer
- source: invariant
  given: a clock and a three-minute TimeWindow
  when: window is called
  then: the TimeWindow with three-minute duration is returned
  citation: 'functionality `window`: Returns the TimeWindow currently configured on the buffer.'
- source: invariant
  given: the buffer contains events older than the window duration and events within the window
  when: current_events is called
  then: only events within the window are returned and stale events are evicted
  citation: 'functionality `current_events`: Computes the staleness boundary as current time minus window duration. Evicts stale events before returning.'
- source: invariant
  given: the buffer contains events with occurred_at in the future relative to now
  when: current_events is called
  then: future-dated events are included in the result
  citation: 'functionality `current_events`: Future-dated events are included as long as they are not stale.'
- source: invariant
  given: a buffer with multiple events and no source filter specified
  when: current_events_for_source is called with source parameter absent
  then: the result matches what current_events would return
  citation: 'functionality `current_events_for_source`: If the source filter is absent, returns the same result as current_events.'
- source: invariant
  given: the buffer contains events from sources aisstream, earthquake, and wiki
  when: current_events_for_source is called with source "aisstream"
  then: only aisstream events are returned
  citation: 'functionality `current_events_for_source`: If the source is ''aisstream'', returns only events whose source matches that value.'
- source: invariant
  given: the buffer contains events with various sources and source labels
  when: current_events_for_source is called with source "earthquake"
  then: filtering is based on event source, not the label
  citation: 'functionality `current_events_for_source`: Filtering is based on the event source, not the label.'
- source: invariant
  given: the buffer contains events, some stale and some fresh
  when: receive_event adds a new event and then evict_stale is called
  then: the newly added event is retained if fresh, and only fresh events remain
  citation: 'functionality `evict_stale`: After eviction, the buffer contains only events that would currently be returned by current_events.'
- source: invariant
  given: the buffer contains events older than the window and future-dated events
  when: evict_stale is called
  then: stale events are removed but future-dated events are preserved
  citation: 'functionality `evict_stale`: Does not remove future-dated events.'
- source: invariant
  given: a buffer with events already present
  when: receive_event is called multiple times with new PositionEvents
  then: all events accumulate in the buffer without immediate eviction
  citation: 'functionality `receive_event`: Does not evict stale events on every insert; eviction is driven by queries or explicit eviction.'
