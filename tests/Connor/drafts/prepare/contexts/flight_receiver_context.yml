schema: reen.prepare/v2
kind: context
source:
  path: contexts/flight_receiver_context.md
  kind: context
  title: 'Context: FlightReceiverContext'
export:
  name: FlightReceiverContext
role_players:
- name: event_sink
  data_type: EventBufferContext
  responsibility: receives each successfully mapped flight event as a PositionEvent
role_methods:
- role: event_sink
  methods:
  - name: receive_event
    canonical_name: event_sink_receive_event
    citation: accepts a single PositionEvent and stores it for later querying
props:
- name: api_url
  description: base URL of the OpenSky Network states endpoint
- name: api_token
  description: optional bearer token for authenticated OpenSky access; when absent, requests are sent without an authorization header
- name: poll_interval
  description: how frequently the API is queried
- name: bounding_box
  description: optional geographic restriction for the query (min_latitude, max_latitude, min_longitude, max_longitude)
functionalities:
- name: new
  description: Stores the event sink, API URL, optional API token, poll interval, and optional bounding box. Does not start polling during construction.
- name: start
  description: Begins a continuous background loop. Waits for the poll interval to elapse before each fetch cycle. Retains the same configuration and event sink across iterations.
- name: fetch_positions
  description: Issues a GET request to the configured API URL. Applies the bounding box when configured. Includes the bearer token as an authorization header when present. On a successful response, iterates the returned flight state records and processes each one. On failure, records a diagnostic error count and waits until the next interval.
- name: on_position_received
  description: Attempts to parse the raw record as a FlightPosition. If latitude or longitude is absent, discards the record silently. Maps latitude and longitude directly from the flight position when present. Uses the flight position timestamp as occurred_at. Sets source to "flight". Uses the callsign as label when present; falls back to the literal label "flight" when absent. Delivers the resulting PositionEvent to the event sink.
scenarios:
- name: successful poll with valid positions
  given: a successful API response containing three valid positions
  when: fetch_positions runs
  then: three PositionEvents with source "flight" are delivered
- name: missing coordinates are silently dropped
  given: a position record with no latitude
  when: on_position_received runs
  then: no PositionEvent is emitted
- name: absent callsign uses fallback label
  given: a flight record without a callsign
  when: on_position_received runs
  then: the PositionEvent label is "flight"
synthesised_tests:
- source: scenario
  given: a successful API response containing three valid positions
  when: fetch_positions runs
  then: three PositionEvents with source "flight" are delivered
  citation: Scenarios / successful poll with valid positions
- source: scenario
