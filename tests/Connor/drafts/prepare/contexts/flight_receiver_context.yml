schema: reen.prepare/v2
kind: context
source:
  path: contexts/flight_receiver_context.md
  kind: context
  title: 'Context: FlightReceiverContext'
export:
  name: FlightReceiverContext
role_players:
- name: event_sink
  data_type: EventBufferContext
  responsibility: receives each successfully mapped flight event as a PositionEvent
role_methods:
- role: event_sink
  methods:
  - name: receive_event
    canonical_name: event_sink_receive_event
    citation: accepts a single PositionEvent and stores it for later querying
props:
- name: api_url
  description: base URL of the OpenSky Network states endpoint
- name: api_token
  description: optional bearer token for authenticated OpenSky access; when absent, requests are sent without an authorization header
- name: poll_interval
  description: how frequently the API is queried
- name: bounding_box
  description: optional geographic restriction for the query (min_latitude, max_latitude, min_longitude, max_longitude)
functionalities:
- name: new
  description: Stores the event sink, API URL, optional API token, poll interval, and optional bounding box. Does not start polling during construction.
- name: start
  description: Begins a continuous background loop. Waits for the poll interval to elapse before each fetch cycle. Retains the same configuration and event sink across iterations.
- name: fetch_positions
  description: Issues a GET request to the configured API URL. Applies the bounding box when configured. Includes the bearer token as an authorization header when present. On a successful response, iterates the returned flight state records and processes each one. On failure, records a diagnostic error count and waits until the next interval.
- name: on_position_received
  description: Attempts to parse the raw record as a FlightPosition. If latitude or longitude is absent, discards the record silently. Maps latitude and longitude directly from the flight position when present. Uses the flight position timestamp as occurred_at. Sets source to "flight". Uses the callsign as label when present; falls back to the literal label "flight" when absent. Delivers the resulting PositionEvent to the event sink.
scenarios:
- name: successful poll with valid positions
  given: a successful API response containing three valid positions
  when: fetch_positions runs
  then: three PositionEvents with source "flight" are delivered
- name: missing coordinates are silently dropped
  given: a position record with no latitude
  when: on_position_received runs
  then: no PositionEvent is emitted
- name: absent callsign uses fallback label
  given: a flight record without a callsign
  when: on_position_received runs
  then: the PositionEvent label is "flight"
synthesised_tests:
- source: scenario
  given: a successful API response containing three valid positions
  when: fetch_positions runs
  then: three PositionEvents with source "flight" are delivered
  citation: Scenarios / successful poll with valid positions
- source: scenario
  given: a position record with no latitude
  when: on_position_received runs
  then: no PositionEvent is emitted
  citation: Scenarios / missing coordinates are silently dropped
- source: scenario
  given: a flight record without a callsign
  when: on_position_received runs
  then: the PositionEvent label is "flight"
  citation: Scenarios / absent callsign uses fallback label
- source: invariant
  given: a FlightReceiverContext constructed with event sink, API URL, poll interval, and optional token
  when: the context is initialized
  then: the configuration is stored and no polling has started
  citation: 'functionality `new`: Stores the event sink, API URL, optional API token, poll interval, and optional bounding box. Does not start polling during construction.'
- source: invariant
  given: a FlightReceiverContext with stored configuration
  when: start is called
  then: a continuous background loop begins and respects the configured poll interval between fetch cycles
  citation: 'functionality `start`: Begins a continuous background loop. Waits for the poll interval to elapse before each fetch cycle. Retains the same configuration and event sink across iterations.'
- source: invariant
  given: a FlightReceiverContext with a configured bearer token
  when: fetch_positions issues a GET request
  then: the authorization header includes the bearer token
  citation: 'functionality `fetch_positions`: Issues a GET request to the configured API URL. Applies the bounding box when configured. Includes the bearer token as an authorization header when present.'
- source: invariant
  given: a FlightReceiverContext with a configured bounding box
  when: fetch_positions issues a GET request
  then: the bounding box parameters are applied to the request
  citation: 'functionality `fetch_positions`: Issues a GET request to the configured API URL. Applies the bounding box when configured.'
- source: invariant
  given: a failed API response from fetch_positions
  when: fetch_positions completes
  then: a diagnostic error count is recorded and polling waits until the next interval
  citation: 'functionality `fetch_positions`: On failure, records a diagnostic error count and waits until the next interval.'
- source: invariant
  given: a position record with no longitude
  when: on_position_received runs
  then: no PositionEvent is emitted
  citation: 'functionality `on_position_received`: If latitude or longitude is absent, discards the record silently.'
- source: invariant
  given: a valid flight position with latitude, longitude, timestamp, and callsign
  when: on_position_received processes the record
  then: the resulting PositionEvent contains the callsign as label, coordinates from the flight position, occurred_at from the flight position timestamp, and source set to 'flight'
  citation: 'functionality `on_position_received`: Maps latitude and longitude directly from the flight position when present. Uses the flight position timestamp as occurred_at. Sets source to ''flight''. Uses the callsign as label when present.'
vocabulary_bindings:
- name: event_sink
  resolution: role_player
  resolved_to: EventBufferContext
- name: EventBufferContext
  resolution: data
  resolved_to: EventBufferContext
- name: api_url
  resolution: prop
- name: api_token
  resolution: prop
