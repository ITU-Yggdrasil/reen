schema: reen.prepare/v2
kind: context
source:
  path: contexts/earthquake_receiver_context.md
  kind: context
  title: 'Context: EarthquakeReceiverContext'
export:
  name: EarthquakeReceiverContext
role_players:
- name: event_sink
  data_type: EventBufferContext
  responsibility: receives each successfully mapped and deduplicated earthquake event as a PositionEvent
role_methods:
- role: event_sink
  methods:
  - name: receive_event
    canonical_name: event_sink_receive_event
    citation: accepts a single PositionEvent and stores it for later querying
props:
- name: api_url
  description: URL of the USGS GeoJSON feed to poll
- name: poll_interval
  description: how frequently the feed is fetched; once per minute is a sensible default
- name: min_magnitude
  description: optional lower bound on magnitude; events below this threshold are silently dropped
functionalities:
- name: new
  description: Stores the event sink, API URL, poll interval, and optional minimum magnitude. Initializes an empty set of seen event IDs for deduplication. Does not start polling during construction.
- name: start
  description: Begins a continuous background loop. Waits for the poll interval to elapse before each fetch cycle. Retains the same configuration and deduplication state across iterations.
- name: fetch_events
  description: Issues a GET request to the configured API URL. On a successful response, parses the GeoJSON feature collection and processes each feature. On failure, records a diagnostic error count and waits until the next interval.
- name: on_event_received
  description: Attempts to parse the raw feature as an EarthquakeEvent. If the event ID has already been seen, discards it silently. Records each newly seen event ID for future deduplication. If a minimum magnitude is configured and the event's magnitude is below the threshold, discards the event silently. Maps latitude and longitude from the epicentre coordinates. Uses the event timestamp as occurred_at. Sets source to "earthquake". Forms the label from magnitude and place when both are available, using whichever is present otherwise. Delivers the resulting PositionEvent to the event sink.
realisation_target: client_also
scenarios:
- name: duplicate event is deduplicated
  given: an already-seen earthquake event arrives a second time
  when: on_event_received runs
  then: no PositionEvent is emitted and the duplicate is silently discarded
- name: magnitude below threshold is dropped
  given: a minimum magnitude of 3.0 and an event with magnitude 2.5
  when: on_event_received runs
  then: the event is discarded
- name: successful poll with unique events
  given: a successful feed response containing five unique events with valid coordinates
  when: fetch_events runs
  then: five PositionEvents with source "earthquake" can be delivered
synthesised_tests:
- source: scenario
  given: an already-seen earthquake event arrives a second time
  when: on_event_received runs
  then: no PositionEvent is emitted and the duplicate is silently discarded
  citation: Scenarios / duplicate event is deduplicated
- source: scenario
  given: a minimum magnitude of 3.0 and an event with magnitude 2.5
  when: on_event_received runs
  then: the event is discarded
  citation: Scenarios / magnitude below threshold is dropped
- source: scenario
  given: a successful feed response containing five unique events with valid coordinates
  when: fetch_events runs
  then: five PositionEvents with source "earthquake" can be delivered
  citation: Scenarios / successful poll with unique events
- source: invariant
  given: a new EarthquakeReceiverContext with event sink, API URL, poll interval, and minimum magnitude
  when: construction completes
  then: the context stores all configuration parameters, initializes an empty set of seen event IDs, and does not start polling
  citation: 'functionality `new`: Stores configuration and initializes empty deduplication set without starting polling'
- source: invariant
  given: a started EarthquakeReceiverContext with a configured poll interval
  when: start is called
  then: a continuous background loop begins that waits for the poll interval to elapse before each fetch cycle and retains configuration and deduplication state across iterations
  citation: 'functionality `start`: Begins continuous loop respecting poll interval and maintaining state'
- source: invariant
  given: an earthquake event with magnitude 4.5, place 'San Francisco', latitude 37.7, longitude -122.4, timestamp '2024-01-15T10:30:00Z', and a unique event ID
  when: on_event_received processes the feature
  then: a PositionEvent is delivered with latitude 37.7, longitude -122.4, occurred_at set to the timestamp, source set to 'earthquake', and label set to '4.5 San Francisco'
  citation: 'functionality `on_event_received`: Maps coordinates, uses timestamp as occurred_at, sets source to ''earthquake'', forms label from magnitude and place'
- source: invariant
  given: an earthquake event with only magnitude 3.2 and no place information
  when: on_event_received processes the feature
  then: a PositionEvent is delivered with label set to '3.2' (magnitude only)
  citation: 'functionality `on_event_received`: Forms label from whichever of magnitude or place is available'
- source: invariant
  given: an earthquake event with only place 'Tokyo' and no magnitude information
  when: on_event_received processes the feature
  then: a PositionEvent is delivered with label set to 'Tokyo' (place only)
  citation: 'functionality `on_event_received`: Forms label from whichever of magnitude or place is available'
- source: invariant
  given: a failed HTTP response from the configured API URL
  when: fetch_events runs
  then: a diagnostic error count is recorded and the context waits until the next poll interval before attempting another fetch
  citation: 'functionality `fetch_events`: On failure, records diagnostic error count and waits until next interval'
- source: invariant
  given: a successful GeoJSON feature collection response from the API with multiple features
  when: fetch_events runs
  then: each feature in the collection is passed to on_event_received for processing
  citation: 'functionality `fetch_events`: Parses GeoJSON feature collection and processes each feature'
- source: invariant
  given: an earthquake event with a minimum magnitude threshold of 5.0 configured and the event has magnitude 5.0
  when: on_event_received runs
  then: the event is accepted and a PositionEvent is delivered (event magnitude equals threshold)
  citation: 'functionality `on_event_received`: Discards silently only if magnitude is below threshold'
