schema: reen.prepare/v2
kind: context
source:
  path: contexts/aisstream_receiver_context.md
  kind: context
  title: 'Context: AISStreamReceiverContext'
export:
  name: AISStreamReceiverContext
role_players:
- name: aisstream
  data_type: AISStreamTransport
  responsibility: owns the upstream communication and subscription lifecycle, delivering only subscribed messages
- name: event_sink
  data_type: EventBufferContext
  responsibility: receives each successfully mapped vessel event as a PositionEvent
role_methods:
- role: aisstream
  methods:
  - name: start_position_subscription
    canonical_name: aisstream_start_position_subscription
    citation: starts or refreshes an AISStream subscription and delivers matching raw messages; the positive filter for this receiver is exactly PositionReport and StandardClassBPositionReport
- role: event_sink
  methods:
  - name: receive_event
    canonical_name: event_sink_receive_event
    citation: accepts a single PositionEvent and stores it for later querying
props:
- name: bounding_box
  description: optional geographic restriction for the AISStream subscription (min_latitude, max_latitude, min_longitude, max_longitude)
functionalities:
- name: new
  description: Stores the aisstream collaborator, event sink, and optional bounding box. Does not start the upstream subscription during construction.
- name: start
  description: Asks the aisstream collaborator to start a position subscription using the configured bounding box and the fixed positive filter of PositionReport and StandardClassBPositionReport. Does not accept upstream message families outside those two types.
- name: receive_aisstream_message
  description: Attempts to parse the raw message as an AISStreamPositionMessage. If parsing fails, discards the message silently and records a parse-failure count for diagnostics. If latitude or longitude is absent, discards the record silently. If latitude is 91.0 or longitude is 181.0, discards the record silently because those are AIS invalid-coordinate sentinels. Maps latitude and longitude directly from the position message when valid. Uses the boundary record's observed_at as occurred_at. Sets source to "aisstream". Uses the vessel name as label when present and non-blank. Falls back to the MMSI rendered as text when the vessel name is absent or blank. Delivers the resulting PositionEvent to the event sink.
realisation_target: client_also
scenarios:
- name: valid message without vessel name
  given: a subscribed position message with valid coordinates but no vessel name
  when: receive_aisstream_message runs
  then: a PositionEvent is delivered with source "aisstream" and the MMSI text as its label
- name: invalid coordinate sentinel is discarded
  given: a message with latitude 91.0
  when: receive_aisstream_message runs
  then: the record is discarded
- name: subscription uses narrow filter
  given: a configured receiver with a bounding box
  when: start is called
  then: the aisstream collaborator is asked to subscribe only to PositionReport and StandardClassBPositionReport for that region
synthesised_tests:
- source: scenario
  given: a subscribed position message with valid coordinates but no vessel name
  when: receive_aisstream_message runs
  then: a PositionEvent is delivered with source "aisstream" and the MMSI text as its label
  citation: Scenarios / valid message without vessel name
- source: scenario
  given: a message with latitude 91.0
  when: receive_aisstream_message runs
  then: the record is discarded
  citation: Scenarios / invalid coordinate sentinel is discarded
- source: scenario
  given: a configured receiver with a bounding box
  when: start is called
  then: the aisstream collaborator is asked to subscribe only to PositionReport and StandardClassBPositionReport for that region
  citation: Scenarios / subscription uses narrow filter
- source: invariant
  given: a new AISStreamReceiverContext is constructed with aisstream collaborator, event sink, and bounding box
  when: the constructor completes
  then: no upstream subscription is started
  citation: 'functionality `new`: Does not start the upstream subscription during construction'
- source: invariant
  given: a new AISStreamReceiverContext is constructed with aisstream collaborator and event sink
  when: the constructor completes
  then: the aisstream collaborator, event sink, and bounding box are stored for later use
  citation: 'functionality `new`: Stores the aisstream collaborator, event sink, and optional bounding box'
- source: invariant
  given: a subscribed position message with valid coordinates and a non-blank vessel name
  when: receive_aisstream_message runs
  then: a PositionEvent is delivered with the vessel name as its label
  citation: 'functionality `receive_aisstream_message`: Uses the vessel name as label when present and non-blank'
- source: invariant
  given: a raw message that cannot be parsed as an AISStreamPositionMessage
  when: receive_aisstream_message runs
  then: the message is discarded silently and a parse-failure count is incremented for diagnostics
  citation: 'functionality `receive_aisstream_message`: If parsing fails, discards the message silently and records a parse-failure count for diagnostics'
- source: invariant
  given: a valid position message with latitude absent
  when: receive_aisstream_message runs
  then: the record is discarded silently
  citation: 'functionality `receive_aisstream_message`: If latitude or longitude is absent, discards the record silently'
- source: invariant
  given: a valid position message with longitude absent
  when: receive_aisstream_message runs
  then: the record is discarded silently
  citation: 'functionality `receive_aisstream_message`: If latitude or longitude is absent, discards the record silently'
- source: invariant
  given: a message with longitude 181.0
  when: receive_aisstream_message runs
  then: the record is discarded silently because 181.0 is an AIS invalid-coordinate sentinel
  citation: 'functionality `receive_aisstream_message`: If latitude is 91.0 or longitude is 181.0, discards the record silently because those are AIS invalid-coordinate sentinels'
- source: invariant
  given: a valid position message with latitude 45.5 and longitude -122.3
  when: receive_aisstream_message runs
  then: a PositionEvent is delivered with latitude and longitude mapped directly from the position message
  citation: 'functionality `receive_aisstream_message`: Maps latitude and longitude directly from the position message when valid'
- source: invariant
  given: a valid position message with an observed_at timestamp
  when: receive_aisstream_message runs
  then: a PositionEvent is delivered with the observed_at value set as occurred_at
  citation: 'functionality `receive_aisstream_message`: Uses the boundary record''s observed_at as occurred_at'
- source: invariant
  given: a valid position message is received
  when: receive_aisstream_message runs
  then: a PositionEvent is delivered with source set to 'aisstream'
  citation: 'functionality `receive_aisstream_message`: Sets source to ''aisstream'''
- source: invariant
  given: an upstream message that is not a PositionReport or StandardClassBPositionReport
  when: receive_aisstream_message processes it
  then: the message is rejected and not accepted
  citation: 'functionality `start`: Does not accept upstream message families outside those two types'
