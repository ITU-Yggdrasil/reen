schema: reen.prepare/v2
kind: context
source:
  path: contexts/lightning_receiver_context.md
  kind: context
  title: 'Context: LightningReceiverContext'
export:
  name: LightningReceiverContext
role_players:
- name: event_sink
  data_type: EventBufferContext
  responsibility: receives each successfully mapped lightning event as a PositionEvent
role_methods:
- role: event_sink
  methods:
  - name: receive_event
    canonical_name: event_sink_receive_event
    citation: accepts a single PositionEvent and stores it for later querying
props:
- name: websocket_url
  description: URL of the Blitzortung websocket endpoint, connected when the receiver starts
- name: reconnect_delay
  description: how long to wait before reconnecting after a dropped connection
functionalities:
- name: new
  description: Stores the event sink, websocket URL, and reconnect delay. Does not open the websocket connection during construction.
- name: start
  description: Opens the websocket connection to the configured URL and begins reading messages continuously in the background. After a successful handshake, sends the required Blitzortung subscription frame. Continues processing messages until the connection is lost.
- name: on_message_received
  description: Normalizes the incoming payload before parsing. If the payload is already valid JSON, uses it unchanged. Otherwise, if the payload matches the Blitzortung obfuscated websocket format, decodes it into JSON first. Attempts to parse the normalized JSON as a LightningStrike. If parsing succeeds, maps latitude and longitude directly from the strike, uses the strike timestamp as occurred_at, sets source to "lightning" and label to "lightning", and delivers the resulting PositionEvent to the event sink. If parsing fails, discards the message, increments a parse-failure count, and logs the error together with the payload.
- name: on_connection_lost
  description: Runs when the websocket connection drops. Waits for the configured reconnect delay, then allows the outer receive loop to establish a fresh connection. Retains the same event sink and configuration across reconnects.
- name: on_connection_established
  description: Runs immediately after the websocket handshake completes successfully. Serves as the successful-connection hook for the receiver lifecycle. Does not reset retained configuration or event sink state.
realisation_target: client_also
scenarios:
- name: obfuscated payload produces event
  given: an obfuscated Blitzortung payload containing a valid strike
  when: on_message_received runs
  then: the payload is decoded, parsed, and a PositionEvent with source "lightning" is delivered
- name: reconnect after disconnect
  given: the websocket connection drops
  when: on_connection_lost runs
  then: a reconnect attempt is made after the reconnect delay has elapsed
- name: unparseable message is discarded
  given: a payload that cannot be parsed as a LightningStrike
  when: on_message_received runs
  then: the message is discarded and a parse-failure count is incremented
synthesised_tests:
- source: scenario
  given: an obfuscated Blitzortung payload containing a valid strike
  when: on_message_received runs
  then: the payload is decoded, parsed, and a PositionEvent with source "lightning" is delivered
  citation: Scenarios / obfuscated payload produces event
- source: scenario
  given: the websocket connection drops
  when: on_connection_lost runs
  then: a reconnect attempt is made after the reconnect delay has elapsed
  citation: Scenarios / reconnect after disconnect
- source: scenario
  given: a payload that cannot be parsed as a LightningStrike
  when: on_message_received runs
  then: the message is discarded and a parse-failure count is incremented
  citation: Scenarios / unparseable message is discarded
- source: invariant
  given: a new LightningReceiverContext is constructed with an event sink, websocket URL, and reconnect delay
  when: the constructor completes
  then: the websocket connection is not opened and the receiver remains idle
  citation: 'functionality `new`: Does not open the websocket connection during construction.'
- source: invariant
  given: a LightningReceiverContext with stored configuration and no active connection
  when: start is called
  then: the websocket connection is opened to the configured URL and the Blitzortung subscription frame is sent after handshake completes
  citation: 'functionality `start`: Opens the websocket connection to the configured URL and begins reading messages continuously. After a successful handshake, sends the required Blitzortung subscription frame.'
- source: invariant
  given: a LightningReceiverContext actively reading messages from the websocket
  when: start continues processing
  then: messages are continuously read from the connection until it is lost
  citation: 'functionality `start`: Continues processing messages until the connection is lost.'
- source: invariant
  given: a raw JSON payload received from the websocket
  when: on_message_received processes it
  then: the payload is recognized as valid JSON and used unchanged for parsing
  citation: 'functionality `on_message_received`: If the payload is already valid JSON, uses it unchanged.'
- source: invariant
  given: a valid LightningStrike parsed from the message payload
  when: on_message_received maps the strike to a PositionEvent
  then: latitude and longitude are mapped directly from the strike, occurred_at is set from the strike timestamp, source is set to 'lightning', and label is set to 'lightning'
  citation: 'functionality `on_message_received`: maps latitude and longitude directly from the strike, uses the strike timestamp as occurred_at, sets source to ''lightning'' and label to ''lightning''.'
- source: invariant
  given: a malformed JSON payload that cannot be parsed as a LightningStrike
  when: on_message_received attempts to parse it
  then: the message is discarded and the error is logged together with the payload
  citation: 'functionality `on_message_received`: If parsing fails, discards the message and logs the error together with the payload.'
- source: invariant
  given: the websocket connection has just dropped
  when: on_connection_lost executes
  then: the receiver waits for the configured reconnect delay before allowing a fresh connection attempt
  citation: 'functionality `on_connection_lost`: Waits for the configured reconnect delay, then allows the outer receive loop to establish a fresh connection.'
- source: invariant
  given: a LightningReceiverContext that has reconnected after a previous connection loss
  when: on_connection_lost completes and a new connection is established
  then: the same event sink and configuration are retained across the reconnect
  citation: 'functionality `on_connection_lost`: Retains the same event sink and configuration across reconnects.'
- source: invariant
  given: the websocket handshake has just completed successfully
  when: on_connection_established runs
  then: the successful-connection hook is triggered and the receiver is ready to process messages
  citation: 'functionality `on_connection_established`: Serves as the successful-connection hook for the receiver lifecycle.'
- source: invariant
  given: a LightningReceiverContext with an active websocket connection that has already processed messages
  when: on_connection_established runs after a reconnect
  then: the retained event sink and configuration state are not reset
  citation: 'functionality `on_connection_established`: Does not reset retained configuration or event sink state.'
vocabulary_bindings:
- name: event_sink
  resolution: role_player
  resolved_to: EventBufferContext
- name: EventBufferContext
  resolution: data
  resolved_to: EventBufferContext
- name: websocket_url
  resolution: prop
- name: reconnect_delay
  resolution: prop
- name: event_sink_receive_event
  resolution: role_method
  resolved_to: event_sink.receive_event
- name: event_sink
  resolution: role
