- name: event_sink
  resolution: role_player
  resolved_to: EventBufferContext
- name: EventBufferContext
  resolution: data
  resolved_to: EventBufferContext
- name: websocket_url
  resolution: prop
- name: reconnect_delay
  resolution: prop
- name: event_sink_receive_event
  resolution: role_method
  resolved_to: event_sink.receive_event
- name: event_sink
  resolution: role
