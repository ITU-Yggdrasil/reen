schema: reen.prepare/v2
kind: context
source:
  path: contexts/lightning_receiver_context.md
  kind: context
  title: 'Context: LightningReceiverContext'
export:
  name: LightningReceiverContext
role_players:
- name: event_sink
  data_type: EventBufferContext
  responsibility: receives each successfully mapped lightning event as a PositionEvent
role_methods:
- role: event_sink
  methods:
  - name: receive_event
    canonical_name: event_sink_receive_event
    citation: accepts a single PositionEvent and stores it for later querying
props:
- name: websocket_url
  description: URL of the Blitzortung websocket endpoint, connected when the receiver starts
- name: reconnect_delay
  description: how long to wait before reconnecting after a dropped connection
functionalities:
- name: new
  description: Stores the event sink, websocket URL, and reconnect delay. Does not open the websocket connection during construction.
- name: start
  description: Opens the websocket connection to the configured URL and begins reading messages continuously in the background. After a successful handshake, sends the required Blitzortung subscription frame. Continues processing messages until the connection is lost.
- name: on_message_received
  description: Normalizes the incoming payload before parsing. If the payload is already valid JSON, uses it unchanged. Otherwise, if the payload matches the Blitzortung obfuscated websocket format, decodes it into JSON first. Attempts to parse the normalized JSON as a LightningStrike. If parsing succeeds, maps latitude and longitude directly from the strike, uses the strike timestamp as occurred_at, sets source to "lightning" and label to "lightning", and delivers the resulting PositionEvent to the event sink. If parsing fails, discards the message, increments a parse-failure count, and logs the error together with the payload.
- name: on_connection_lost
  description: Runs when the websocket connection drops. Waits for the configured reconnect delay, then allows the outer receive loop to establish a fresh connection. Retains the same event sink and configuration across reconnects.
- name: on_connection_established
  description: Runs immediately after the websocket handshake completes successfully. Serves as the successful-connection hook for the receiver lifecycle. Does not reset retained configuration or event sink state.
scenarios:
- name: obfuscated payload produces event
  given: an obfuscated Blitzortung payload containing a valid strike
  when: on_message_received runs
  then: the payload is decoded, parsed, and a PositionEvent with source "lightning" is delivered
- name: reconnect after disconnect
  given: the websocket connection drops
  when: on_connection_lost runs
  then: a reconnect attempt is made after the reconnect delay has elapsed
- name: unparseable message is discarded
  given: a payload that cannot be parsed as a LightningStrike
  when: on_message_received runs
  then: the message is discarded and a parse-failure count is incremented
synthesised_tests:
- source: scenario
  given: an obfuscated Blitzortung payload containing a valid strike
  when: on_message_received runs
  then: the payload is decoded, parsed, and a PositionEvent with source "lightning" is delivered
  citation: Scenarios / obfuscated payload produces event
- source: scenario
  given: the websocket connection drops
  when: on_connection_lost runs
  then: a reconnect attempt is made after the reconnect delay has elapsed
  citation: Scenarios / reconnect after disconnect
- source: scenario
  given: a payload that cannot be parsed as a LightningStrike
  when: on_message_received runs
  then: the message is discarded and a parse-failure count is incremented
  citation: Scenarios / unparseable message is discarded
- source: invariant
  given: a LightningReceiverContext is constructed with an event sink, websocket URL, and reconnect delay
  when: the constructor completes
  then: the event sink, URL, and reconnect delay are stored, and the websocket connection remains closed
  citation: 'functionality `new`: Stores the event sink, websocket URL, and reconnect delay. Does not open the websocket connection during construction.'
- source: invariant
  given: a LightningReceiverContext with a configured websocket URL and event sink
  when: start is invoked
  then: the websocket connection opens to the configured URL and a background message-reading loop begins
  citation: 'functionality `start`: Opens the websocket connection to the configured URL and begins reading messages continuously in the background.'
- source: invariant
  given: the websocket connection has been established
  when: the handshake completes successfully
  then: the Blitzortung subscription frame is sent and message processing continues
  citation: 'functionality `start`: After a successful handshake, sends the required Blitzortung subscription frame. Continues processing messages until the connection is lost.'
- source: invariant
  given: a valid JSON payload representing a LightningStrike
  when: on_message_received processes it
  then: the payload is used unchanged, parsed as a LightningStrike, and a PositionEvent with latitude, longitude, occurred_at from the strike timestamp, source 'lightning', and label 'lightning' is delivered to the event sink
  citation: 'functionality `on_message_received`: Normalizes the incoming payload before parsing. If the payload is already valid JSON, uses it unchanged. Attempts to parse the normalized JSON as a LightningStrike. If parsing succeeds, maps latitude and longitude directly from the strike, uses the strike timestamp as occurred_at, sets source to ''lightning'' and label to ''lightning'', and delivers the resulting PositionEvent to the event sink.'
- source: invariant
  given: a payload that fails to parse as JSON and does not match the Blitzortung obfuscated format
  when: on_message_received processes it
  then: the message is discarded, a parse-failure count is incremented, and the error is logged with the payload
  citation: 'functionality `on_message_received`: If parsing fails, discards the message, increments a parse-failure count, and logs the error together with the payload.'
- source: invariant
  given: the websocket connection drops after being established
  when: on_connection_lost runs
  then: the context waits for the configured reconnect delay before returning control to allow a fresh connection attempt
  citation: 'functionality `on_connection_lost`: Waits for the configured reconnect delay, then allows the outer receive loop to establish a fresh connection.'
- source: invariant
  given: a LightningReceiverContext that has reconnected after a prior connection loss
  when: on_connection_lost completes and a fresh connection is established
  then: the same event sink and configuration are retained across the reconnection
  citation: 'functionality `on_connection_lost`: Retains the same event sink and configuration across reconnects.'
- source: invariant
  given: the websocket handshake has just completed successfully
  when: on_connection_established is invoked
  then: the successful-connection hook is triggered and the receiver lifecycle acknowledges the established connection
  citation: 'functionality `on_connection_established`: Runs immediately after the websocket handshake completes successfully. Serves as the successful-connection hook for the receiver lifecycle.'
- source: invariant
  given: a LightningReceiverContext with active configuration and an event sink
  when: on_connection_established runs after reconnection
  then: the retained event sink and configuration state are not reset
  citation: 'functionality `on_connection_established`: Does not reset retained configuration or event sink state.'
