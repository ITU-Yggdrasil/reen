schema: reen.prepare/v2
kind: data
source:
  path: data/Position.md
  kind: data
  title: 'Data: Position'
export:
  name: Position
attributes:
- name: x
  description: horizontal coordinate; 0 is the leftmost column, grows to the right
- name: y
  description: vertical coordinate; 0 is the top row, grows downward (screen convention)
invariants:
- Both x and y are non-negative whole numbers.
scenarios:
- name: top-left corner
  given: x is 0 and y is 0
  when: a Position is created
  then: it represents the top-left cell of the board
- name: moving down increases y
  given: a Position at (3, 2)
  when: y is increased by 1
  then: the new Position is (3, 3), which is one row below
synthesised_tests:
- source: scenario
  given: x is 0 and y is 0
  when: a Position is created
  then: it represents the top-left cell of the board
  citation: Scenarios / top-left corner
- source: scenario
  given: a Position at (3, 2)
  when: y is increased by 1
  then: the new Position is (3, 3), which is one row below
  citation: Scenarios / moving down increases y
- source: invariant
  given: 'a Data: Position that might violate: Both x and y are non-negative whole numbers.'
  when: the invariant is tested
  then: 'the invariant holds: Both x and y are non-negative whole numbers.'
  citation: Invariants / Both x and y are non-negative whole numbers.
- source: invariant
  given: x is -1 and y is 5
  when: a Position is created with negative x
  then: the Position creation fails or x is rejected to maintain the invariant
  citation: 'invariant: Both x and y are non-negative whole numbers'
- source: invariant
  given: x is 3 and y is -2
  when: a Position is created with negative y
  then: the Position creation fails or y is rejected to maintain the invariant
  citation: 'invariant: Both x and y are non-negative whole numbers'
- source: invariant
  given: x is 2.5 and y is 4
  when: a Position is created with a non-whole number for x
  then: the Position creation fails or x is rejected to maintain the invariant
  citation: 'invariant: Both x and y are non-negative whole numbers'
- source: invariant
  given: x is 10 and y is 3.7
  when: a Position is created with a non-whole number for y
  then: the Position creation fails or y is rejected to maintain the invariant
  citation: 'invariant: Both x and y are non-negative whole numbers'
- source: invariant
  given: a Position at (0, 0)
  when: x is set to 0 and y is set to 0
  then: both coordinates remain non-negative whole numbers satisfying the invariant
  citation: 'invariant: Both x and y are non-negative whole numbers'
vocabulary_bindings:
- name: x
  resolution: attribute
- name: y
  resolution: attribute
