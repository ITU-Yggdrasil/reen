schema: reen.prepare/v2
kind: data
source:
  path: data/Board.md
  kind: data
  title: 'Data: Board'
export:
  name: Board
attributes:
- name: width
  description: positive whole number of columns in the board
- name: height
  description: positive whole number of rows in the board
- name: cells
  description: a mapping from each in-bounds position to its display symbol; contains exactly one entry per coordinate within the board dimensions
invariants:
- Width and height are both greater than zero.
- Every coordinate within bounds has exactly one cell entry; no entries exist outside bounds.
- Cells on the outer ring (edges of the board) may contain wall symbols.
- Interior cells may contain blank space, snake symbols, or food symbols depending on the current frame.
operations:
- name: symbol_at
  description: Returns the display symbol stored at a given coordinate.
- name: with_symbol_at
  description: Returns a new Board identical to this one except that the cell at the given position is replaced with the given symbol. If the position is outside the board bounds, the returned board is an unchanged copy. This is the sole way to produce an overlaid board picture — callers that need to render snake or food cells on top of the base board chain calls to with_symbol_at starting from a base board.
scenarios:
- name: read a wall symbol
  given: a 10 by 10 board where (0, 0) contains a wall symbol "w"
  when: symbol_at is called for (0, 0)
  then: the result is "w"
- name: overlay a snake symbol
  given: a 10 by 10 board where (3, 3) contains a space
  when: with_symbol_at is called for position (3, 3) with symbol "s"
  then: the returned board has "s" at (3, 3) and all other cells unchanged
- name: out-of-bounds overlay is a no-op
  given: a 10 by 10 board
  when: with_symbol_at is called for position (15, 15) with symbol "x"
  then: the returned board is identical to the original
