schema: reen.prepare/v2
kind: data
source:
  path: data/Direction.md
  kind: data
  title: 'Data: Direction'
export:
  name: Direction
attributes:
- name: Up
  description: moving upward on the screen; the y coordinate decreases by 1
- name: Down
  description: moving downward on the screen; the y coordinate increases by 1
- name: Left
  description: moving leftward on the screen; the x coordinate decreases by 1
- name: Right
  description: moving rightward on the screen; the x coordinate increases by 1 The board uses screen coordinates where y = 0 is the top row, so "up" decreases y and "down" increases y.
invariants:
- Direction does not know about coordinates itself; the mapping from direction to a position delta must be applied consistently wherever a direction is turned into a next position.
scenarios:
- name: up decreases y
  given: a snake head at (5, 5)
  when: the direction is Up
  then: the next head position is (5, 4)
- name: down increases y
  given: a snake head at (5, 5)
  when: the direction is Down
  then: the next head position is (5, 6)
synthesised_tests:
- source: scenario
  given: a snake head at (5, 5)
  when: the direction is Up
  then: the next head position is (5, 4)
  citation: Scenarios / up decreases y
- source: scenario
  given: a snake head at (5, 5)
  when: the direction is Down
  then: the next head position is (5, 6)
  citation: Scenarios / down increases y
- source: invariant
  given: 'a Data: Direction that might violate: Direction does not know about coordinates itself; the mapping from direction to a position delta must be applied consistently wherever a direction is turned into a next position.'
  when: the invariant is tested
  then: 'the invariant holds: Direction does not know about coordinates itself; the mapping from direction to a position delta must be applied consistently wherever a direction is turned into a next position.'
  citation: Invariants / Direction does not know about coordinates itself; the mapping from direction to a position delta must be applied consistently wherever a direction is turned into a next position.
- source: invariant
  given: a Direction value of Left and two separate position calculation systems
  when: both systems convert the direction to a position delta
  then: both systems produce the same delta of (-1, 0)
  citation: 'invariant: mapping from direction to position delta must be applied consistently wherever a direction is turned into a next position'
- source: invariant
  given: a Direction value of Right and a position (10, 20)
  when: the direction is converted to a position delta by one calculation method and applied to the position
  then: the result is (11, 20) and the Direction itself contains no coordinate information
  citation: 'invariant: Direction does not know about coordinates itself'
- source: invariant
  given: Direction values Up, Down, Left, and Right
  when: each direction is mapped to its position delta across multiple independent modules
  then: all modules agree on the delta mappings and no module contains coordinate state within the Direction
  citation: 'invariant: mapping from direction to a position delta must be applied consistently wherever a direction is turned into a next position'
vocabulary_bindings:
- name: Up
  resolution: attribute
- name: Down
  resolution: attribute
