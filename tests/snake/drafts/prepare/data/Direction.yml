- source: invariant
  given: 'a Data: Direction that might violate: Direction does not know about coordinates itself; the mapping from direction to a position delta must be applied consistently wherever a direction is turned into a next position.'
  when: the invariant is tested
  then: 'the invariant holds: Direction does not know about coordinates itself; the mapping from direction to a position delta must be applied consistently wherever a direction is turned into a next position.'
  citation: Invariants / Direction does not know about coordinates itself; the mapping from direction to a position delta must be applied consistently wherever a direction is turned into a next position.
- source: invariant
  given: a snake head at (10, 20) and a Direction of Left
  when: the direction is converted to a position delta
  then: the delta is (-1, 0) regardless of the current position
  citation: 'invariant: Direction does not know about coordinates itself; the mapping from direction to a position delta must be applied consistently'
- source: invariant
  given: a snake head at (0, 0) and a Direction of Right
  when: the direction is converted to a position delta
  then: the delta is (1, 0) and produces next position (1, 0)
  citation: 'invariant: the mapping from direction to a position delta must be applied consistently wherever a direction is turned into a next position'
- source: invariant
  given: two different positions (3, 7) and (100, 200) both using Direction Up
  when: each position applies the Up direction delta
  then: both produce deltas of (0, -1) and the mapping is identical regardless of starting position
  citation: 'invariant: the mapping from direction to a position delta must be applied consistently wherever a direction is turned into a next position'
