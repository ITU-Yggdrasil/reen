schema: reen.prepare/v2
kind: data
source:
  path: data/Snake.md
  kind: data
  title: 'Data: Snake'
export:
  name: Snake
attributes:
- name: body
  description: an ordered list of positions occupied by the snake; the head is the first element
- name: direction
  description: the current direction of travel
invariants:
- The body contains at least one position.
- All positions in the body are unique (no overlap).
- The first position is the head.
- Every pair of consecutive positions is orthogonally adjacent (they differ by exactly 1 in either x or y, not both).
- A single-element body is valid; the adjacency rule is satisfied trivially.
- The direction does not need to be consistent with the head-to-neck orientation; it records the intended direction of travel independently.
operations:
- name: new
  description: Creates a Snake from a full ordered body and a direction. Fails with an error if the body is empty, if the body overlaps itself, or if consecutive positions are not adjacent cells.
- name: body
  description: Returns the ordered body as a read-only sequence of positions, head first.
- name: direction
  description: Returns the current direction of travel.
scenarios:
- name: construct a valid snake
  given: a body of [(5,5), (4,5), (3,5)] and direction Right
  when: new is called
  then: a Snake is returned with head at (5,5) and length 3
- name: empty body is rejected
  given: an empty body and direction Right
  when: new is called
  then: an error is returned
- name: overlapping body is rejected
  given: a body of [(5,5), (4,5), (5,5)] and direction Right
  when: new is called
  then: an error is returned
- name: non-adjacent body is rejected
  given: a body of [(5,5), (7,5)] and direction Right
  when: new is called
  then: an error is returned
