schema: reen.prepare/v2
kind: data
source:
  path: data/GameState.md
  kind: data
  title: 'Data: GameState'
export:
  name: GameState
attributes:
- name: score
  description: the current score as a non-negative whole number, starting at 0
- name: food_placement
  description: the current Food item on the board, or absent if no food is available
- name: game_started
  description: the UTC millisecond timestamp when the game round started
invariants:
- The score is never negative.
- The score only increases during play.
- The score never exceeds 2,000,000,000 during normal play; score increases saturate at this cap.
operations:
- name: place_food
  description: Returns a new GameState with the food placement updated to the given food (or absent to remove food). All other fields are unchanged.
- name: game_time
  description: Returns the elapsed milliseconds since the game started (current UTC milliseconds minus game_started).
- name: increment_score
  description: Returns a new GameState with the score increased by the given amount, saturating at 2,000,000,000. The amount must be greater than zero. All other fields are unchanged.
- name: food
  description: Returns the current food placement, or absent if none.
- name: game_started
  description: Returns the recorded start timestamp in milliseconds.
scenarios:
- name: place food on a fresh state
  given: a GameState with score 0 and no food
  when: place_food is called with a Food at position (5, 3)
  then: the returned GameState has food at (5, 3) and score 0
- name: increment score by 10
  given: a GameState with score 20
  when: increment_score is called with amount 10
  then: the returned GameState has score 30
- name: score saturates at cap
  given: a GameState with score 1,999,999,995
  when: increment_score is called with amount 10
  then: the returned GameState has score 2,000,000,000
- name: remove food
  given: a GameState with food at (5, 3)
  when: place_food is called with absent
  then: the returned GameState has no food
