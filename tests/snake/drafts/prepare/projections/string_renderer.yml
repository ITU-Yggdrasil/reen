schema: reen.prepare/v2
kind: projection
source:
  path: projections/string_renderer.md
  kind: projection
  title: 'Projection: StringRenderer'
export:
  name: StringRenderer
source_data: Board
queries:
- name: new
  description: Stores the board as the source to query for on-screen symbols. No other collaborators are fetched.
- name: render
  description: |-
    Produces a complete text frame from the board and a given score.

    Iterates rows from top to bottom. Within each row, iterates columns from left to right, collecting the symbol at each coordinate. Each row is followed by a newline. After the last row, a score line in the format "Score: <score>" followed by a newline is included. Returns the complete text.
scenarios:
- name: render a board with a score
  given: a board picture and a score of 12
  when: render is called
  then: 'the returned text contains each row''s symbols followed by newlines, ending with "Score: 12" and a newline'
- name: empty interior shows spaces
  given: a 5 by 5 board where all interior cells are spaces
  when: render is called
  then: the interior rows contain only spaces between the wall symbols
synthesised_tests:
- source: scenario
  given: a board picture and a score of 12
  when: render is called
  then: 'the returned text contains each row''s symbols followed by newlines, ending with "Score: 12" and a newline'
  citation: Scenarios / render a board with a score
- source: scenario
  given: a 5 by 5 board where all interior cells are spaces
  when: render is called
  then: the interior rows contain only spaces between the wall symbols
  citation: Scenarios / empty interior shows spaces
- source: invariant
  given: a StringRenderer constructed with a board
  when: the StringRenderer is queried for its source board
  then: the returned board is the same board that was passed to the constructor
  citation: 'query `new`: Stores the board as the source to query for on-screen symbols'
- source: invariant
  given: a 3 by 3 board with distinct symbols at each coordinate
  when: render is called with score 0
  then: 'the output contains exactly 3 rows with symbols in left-to-right order, each row terminated by newline, followed by ''Score: 0'' and newline'
  citation: 'query `render`: Iterates rows from top to bottom. Within each row, iterates columns from left to right'
- source: invariant
  given: a 1 by 1 board with a single symbol and a score of 999
  when: render is called
  then: 'the output is the single symbol followed by newline, then ''Score: 999'' and newline'
  citation: 'query `render`: Each row is followed by a newline. After the last row, a score line in the format ''Score: <score>'' followed by a newline is included'
- source: invariant
  given: a board where row 0 contains symbols 'A', 'B', 'C' and row 1 contains symbols 'D', 'E', 'F'
  when: render is called
  then: the output contains 'ABC' on the first line and 'DEF' on the second line
  citation: 'query `render`: Within each row, iterates columns from left to right, collecting the symbol at each coordinate'
vocabulary_bindings:
- name: Board
  resolution: data
  resolved_to: Board
