schema: reen.prepare/v2
kind: projection
source:
  path: projections/string_renderer.md
  kind: projection
  title: 'Projection: StringRenderer'
export:
  name: StringRenderer
source_data: Board
queries:
- name: new
  description: Stores the board as the source to query for on-screen symbols. No other collaborators are fetched.
- name: render
  description: |-
    Produces a complete text frame from the board and a given score.

    Iterates rows from top to bottom. Within each row, iterates columns from left to right, collecting the symbol at each coordinate. Each row is followed by a newline. After the last row, a score line in the format "Score: <score>" followed by a newline is included. Returns the complete text.
scenarios:
- name: render a board with a score
  given: a board picture and a score of 12
  when: render is called
  then: 'the returned text contains each row''s symbols followed by newlines, ending with "Score: 12" and a newline'
- name: empty interior shows spaces
  given: a 5 by 5 board where all interior cells are spaces
  when: render is called
  then: the interior rows contain only spaces between the wall symbols
synthesised_tests:
- source: scenario
  given: a board picture and a score of 12
  when: render is called
  then: 'the returned text contains each row''s symbols followed by newlines, ending with "Score: 12" and a newline'
  citation: Scenarios / render a board with a score
- source: scenario
  given: a 5 by 5 board where all interior cells are spaces
  when: render is called
  then: the interior rows contain only spaces between the wall symbols
  citation: Scenarios / empty interior shows spaces
- source: invariant
  given: a StringRenderer initialized with a board
  when: new is called
  then: the board is stored as the source for querying on-screen symbols and no other collaborators are fetched
  citation: 'query `new`: Stores the board as the source to query for on-screen symbols. No other collaborators are fetched.'
- source: invariant
  given: a board with varying symbols across multiple rows and columns
  when: render is called
  then: symbols are collected iterating rows from top to bottom and within each row from left to right
  citation: 'query `render`: Iterates rows from top to bottom. Within each row, iterates columns from left to right, collecting the symbol at each coordinate.'
- source: invariant
  given: a board and a score of 0
  when: render is called
  then: 'the returned text ends with a newline after ''Score: 0'''
  citation: 'query `render`: After the last row, a score line in the format ''Score: <score>'' followed by a newline is included.'
- source: invariant
  given: a 3 by 3 board with symbols '#' at all positions
  when: render is called
  then: each row contains exactly 3 '#' symbols followed by a newline
  citation: 'query `render`: Each row is followed by a newline.'
vocabulary_bindings:
- name: Board
  resolution: data
  resolved_to: Board
