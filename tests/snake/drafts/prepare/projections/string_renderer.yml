schema: reen.prepare/v3
kind: projection
source:
  path: projections/string_renderer.md
  kind: projection
  title: 'Projection: StringRenderer'
export:
  name: StringRenderer
role_players:
- name: board
  data_type: Board
  responsibility: provides the cells the renderer reads symbols from
role_methods:
- role: board
  methods:
  - name: read_dimensions
    canonical_name: board_read_dimensions
    citation: provides the row and column counts of the board picture
  - name: read_symbol_at
    canonical_name: board_read_symbol_at
    citation: provides the symbol at a given row-and-column coordinate
props:
- name: score
  description: the numeric score to display in the score line
functionalities:
- name: render
  description: |-
    Produces a complete text frame from the board and the bound score.

    Iterates rows from top to bottom. Within each row, iterates columns from left to right, collecting the symbol at each coordinate. Each row is followed by a newline. After the last row, a score line in the format "Score: <score>" followed by a newline is included. Returns the complete text.
scenarios:
- name: render a board with a score
  given: a board picture and a score of 12
  when: render is called
  then: 'the returned text contains each row''s symbols followed by newlines, ending with "Score: 12" and a newline'
- name: empty interior shows spaces
  given: a 5 by 5 board where all interior cells are spaces
  when: render is called
  then: the interior rows contain only spaces between the wall symbols
synthesised_tests:
- source: scenario
  given: a board picture and a score of 12
  when: render is called
  then: 'the returned text contains each row''s symbols followed by newlines, ending with "Score: 12" and a newline'
  citation: Scenarios / render a board with a score
- source: scenario
  given: a 5 by 5 board where all interior cells are spaces
  when: render is called
  then: the interior rows contain only spaces between the wall symbols
  citation: Scenarios / empty interior shows spaces
- source: invariant
  given: a board with a single row and a score of 0
  when: render is called
  then: 'the returned text contains the row''s symbols followed by a newline, then "Score: 0" and a newline'
  citation: 'Iterates rows from top to bottom... After the last row, a score line in the format "Score: <score>" followed by a newline is included.'
- source: invariant
  given: a board with columns containing mixed symbols (walls, spaces, and game pieces) and a score of 42
  when: render is called
  then: the returned text collects symbols from left to right within each row and preserves the order of all symbols
  citation: Within each row, iterates columns from left to right, collecting the symbol at each coordinate.
- source: invariant
  given: a 3 by 3 board with distinct symbols in each cell and a score of 99
  when: render is called
  then: the returned text contains all rows separated by newlines, with the final newline appearing after the score line
  citation: Each row is followed by a newline... After the last row, a score line... followed by a newline is included. Returns the complete text.
vocabulary_bindings:
- name: board
  resolution: role_player
  resolved_to: Board
- name: Board
  resolution: data
  resolved_to: Board
- name: score
  resolution: prop
- name: board_read_dimensions
  resolution: role_method
  resolved_to: board.read_dimensions
- name: board_read_symbol_at
  resolution: role_method
  resolved_to: board.read_symbol_at
- name: board
  resolution: role
