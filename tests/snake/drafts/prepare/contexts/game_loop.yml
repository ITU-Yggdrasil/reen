  when: get_score is called
  then: the current score from the game state is returned
  citation: 'get_score: Returns the current score from the game state.'
- source: invariant
  given: a board with no free interior cells and a food dropper that returns no position
  when: new is called
  then: the game state is stored without food
  citation: 'new: If no position is available (the board has no free interior cell), the game state is left without food.'
- source: invariant
  given: a movement action is received that neither repeats nor reverses the current direction
  when: tick is called
  then: the snake's direction is updated to the new movement direction
  citation: 'tick step 7: If a movement action was received and it neither repeats nor reverses the current direction, update the snake''s direction.'
