  citation: 'tick step 9: If the next head lands on a wall cell, a snake body cell, or a position outside the board, the round ends and the player is dead.'
- source: invariant
  given: a movement action is received that repeats the current direction
  when: tick is called
  then: the direction is not updated and the snake continues in the current direction
  citation: 'tick step 7: If a movement action was received and it neither repeats nor reverses the current direction, update the snake''s direction.'
- source: invariant
  given: a movement action is received that reverses the current direction
  when: tick is called
  then: the direction is not updated and the snake continues in the current direction
  citation: 'tick step 7: If a movement action was received and it neither repeats nor reverses the current direction, update the snake''s direction.'
- source: invariant
  given: no action is available from the command role
  when: tick is called
  then: the direction is not updated and the snake continues in the current direction
  citation: 'tick extension: If no action is available, skip the direction update and continue from step 8.'
- source: invariant
