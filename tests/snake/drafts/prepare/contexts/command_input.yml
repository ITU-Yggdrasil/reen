schema: reen.prepare/v2
kind: context
source:
  path: contexts/command_input.md
  kind: context
  title: 'Context: CommandInput'
export:
  name: CommandInput
role_players:
- name: stdin_source
  data_type: keyboard input
  responsibility: supplies key presses from standard input using non-blocking reads
role_methods:
- role: stdin_source
  methods:
  - name: read_available
    canonical_name: stdin_source_read_available
    citation: returns all currently available key presses in arrival order without waiting
props:
- name: buffer
  description: a queue of captured key presses, shared for the whole application session
functionalities:
- name: new
  description: Initialises the buffer as an empty queue and stores the stdin source and buffer as collaborators. One shared buffer is used for the whole application session; menus and gameplay read from the same queue.
- name: capture
  description: Asks the stdin source for all currently available key presses without waiting, then appends each to the end of the buffer in arrival order. If no key presses are available, the buffer is unchanged. Keys already in the buffer before this call remain in place; new keys follow them.
- name: next_key
  description: If the buffer is non-empty, removes and returns the oldest key event. If the buffer is empty, returns no key.
- name: next_action
  description: 'Removes the oldest key from the buffer and maps it to a gameplay action using case-insensitive matching: w maps to move up, a maps to move left, s maps to move down, d maps to move right, and space maps to fire. If the key has no gameplay meaning, the process repeats until a valid key is found or the buffer is exhausted. If no valid action is found, returns no action.'
scenarios:
- name: capture appends in arrival order
  given: key presses are waiting in standard input
  when: capture is called
  then: those key presses are appended to the shared buffer in arrival order
- name: next_key returns oldest
  given: the shared buffer starts with "q"
  when: next_key is called
  then: '"q" is returned and removed from the buffer'
- name: next_action skips invalid keys
  given: the shared buffer starts with "x", then "d"
  when: next_action is called
  then: the invalid key is discarded and a movement-right action is returned
- name: next_action on empty buffer
  given: the shared buffer is empty
  when: next_action is called
  then: no action is returned
