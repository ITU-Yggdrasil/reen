schema: reen.prepare/v2
kind: context
source:
  path: contexts/terminal_renderer.md
  kind: context
  title: 'Context: TerminalRenderer'
export:
  name: TerminalRenderer
role_players:
- name: string_renderer
  data_type: StringRenderer
  responsibility: produces the text representation of the current frame from a board picture and a score
role_methods:
- role: string_renderer
  methods:
  - name: format_frame
    canonical_name: string_renderer_format_frame
    citation: formats the current board picture and score as one complete text frame
props:
- name: screen
  description: the visible terminal output where each frame is shown; the same output is updated from one frame to the next
functionalities:
- name: new
  description: Stores the string renderer and the screen as collaborators. The string renderer is used to format each frame; the screen is updated on each render call.
- name: render
  description: Asks the string renderer to format the current board picture and score as a text frame. Splits the frame into rows. For each row, positions the cursor at the start of that row on the screen and writes the row's text. After all rows are written, flushes the screen so the frame appears immediately. Every row begins at the start of its line so that the frame displays correctly in immediate-input terminal mode.
scenarios:
- name: render a frame
  given: a new frame is ready with a board picture and a score
  when: render is called
  then: the terminal shows the new frame in place, every row beginning at the start of the line
- name: successive frames overwrite in place
  given: two frames are rendered in sequence
  when: the second render completes
  then: the terminal shows only the second frame without leftover content from the first
synthesised_tests:
